name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: jobboard
          POSTGRES_PASSWORD: jobboard_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Có biến này thì các suite e2e chạy thêm trên PostgreSQL (mỗi suite tự tạo và xóa database riêng).
      E2E_POSTGRES_URL: postgres://jobboard:jobboard_dev_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (không tự sửa)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm run build
      - name: Test đơn vị
        run: npm test
      - name: Test e2e (InMemory và PostgreSQL)
        run: npm run test:e2e

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jobboard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
